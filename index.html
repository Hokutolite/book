<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111925">
  <title>畢業紀念冊｜電子書</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111925;
      --panel: rgba(24, 35, 49, .78);
      --line: rgba(226, 205, 157, .22);
      --gold: #d9c18a;
      --gold-bright: #f1dfad;
      --text: #f5f2eb;
      --muted: #a9b2bf;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 50% 34%, rgba(64, 83, 103, .30), transparent 48%),
        radial-gradient(ellipse at 50% 100%, rgba(155, 125, 69, .10), transparent 42%),
        linear-gradient(145deg, #0b111a 0%, #172230 48%, #101721 100%);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }
    .topbar {
      width: min(1180px, calc(100% - 44px));
      margin: 0 auto;
      padding: 12px 0 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: relative;
      z-index: 2;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 38px; height: 38px; flex: 0 0 38px;
      border: 1px solid rgba(217,193,138,.65);
      border-radius: 11px;
      display: grid; place-items: center;
      color: var(--gold-bright);
      font-family: Georgia, serif;
      font-size: 20px;
      box-shadow: inset 0 0 18px rgba(217,193,138,.08), 0 0 22px rgba(217,193,138,.05);
    }
    .brand-title { font-size: 14px; letter-spacing: .16em; font-weight: 650; }
    .brand-subtitle { margin-top: 4px; font-size: 10px; color: var(--muted); letter-spacing: .22em; }
    .top-note { font-size: 11px; color: var(--muted); letter-spacing: .12em; }
    .intro { text-align: center; padding: 5px 18px 0; position: relative; z-index: 1; }
    .eyebrow {
      color: var(--gold); font-size: 10px; letter-spacing: .38em;
      text-transform: uppercase; margin-bottom: 11px;
    }
    h1 {
      font-weight: 500; font-size: clamp(24px, 3vw, 36px);
      letter-spacing: .18em; margin: 0; text-indent: .18em;
    }
    .intro p { color: var(--muted); font-size: 12px; letter-spacing: .08em; margin: 12px 0 0; }
    .ornament { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 18px auto 0; }
    .ornament::before, .ornament::after { content: ""; width: 38px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
    .ornament::after { transform: scaleX(-1); }
    .ornament span { width: 5px; height: 5px; transform: rotate(45deg); background: var(--gold); }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; width: 100%; padding: 10px 18px 20px; position: relative; z-index: 1; }
    .reader-shell {
      width: min(1180px, 100%);
      display: flex; flex-direction: column; align-items: center;
      border: 1px solid rgba(255,255,255,.055);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255,255,255,.035), rgba(255,255,255,.008));
      box-shadow: 0 26px 90px rgba(0,0,0,.18), inset 0 1px rgba(255,255,255,.035);
      padding: 12px 16px 10px;
      min-height: 0;
      min-width: 0;
      height: calc(100dvh - 205px);
    }
    .reader-topline {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; color: var(--muted); font-size: 11px; letter-spacing: .08em;
      margin-bottom: 6px;
    }
    .live-status { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px rgba(217,193,138,.5); }
    #loading-status { text-align: center; color: #d7c79f; font-size: 13px; padding: 70px 15px; }
    .loader {
      width: 28px; height: 28px; margin: 0 auto 17px; border-radius: 50%;
      border: 2px solid rgba(217,193,138,.18); border-top-color: var(--gold);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .book-stage {
      width: 100%; min-height: 0; flex: 1; display: flex; align-items: center; justify-content: center;
      position: relative; padding: 0; overflow: hidden;
      touch-action: pan-y;
    }
    .book-stage::before {
      content: ""; position: absolute; width: 65%; height: 20px; bottom: 0;
      background: rgba(0,0,0,.2); filter: blur(20px); border-radius: 50%;
      pointer-events: none;
    }
    #flipbook {
      display: none; position: relative; z-index: 1;
      flex: 0 0 auto; max-width: 100%; max-height: 100%;
      margin: auto;
    }
    .page { background: #fff; overflow: hidden; }
    .page canvas { display: block; width: 100%; height: 100%; }
    .controls {
      width: 100%; display: flex; align-items: center; justify-content: center;
      gap: 8px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,.07);
      flex-wrap: wrap;
    }
    .control-btn {
      min-width: 42px; height: 40px; padding: 0 14px;
      border: 1px solid rgba(217,193,138,.25); border-radius: 11px;
      color: var(--text); background: rgba(255,255,255,.045);
      font: inherit; font-size: 12px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .2s, border-color .2s, transform .2s;
    }
    .control-btn:hover:not(:disabled) { background: rgba(217,193,138,.12); border-color: rgba(217,193,138,.6); transform: translateY(-1px); }
    .control-btn:focus-visible, .page-input:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }
    .control-btn:disabled { opacity: .32; cursor: not-allowed; }
    .control-btn.primary { color: #161b22; background: linear-gradient(135deg, #ead8a5, #c6a967); border-color: transparent; font-weight: 700; }
    .page-readout { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .page-input {
      width: 48px; height: 36px; text-align: center; color: var(--text);
      background: rgba(0,0,0,.22); border: 1px solid var(--line); border-radius: 8px;
      font: inherit; font-size: 12px;
    }
    .progress-wrap { width: min(420px, 100%); height: 3px; background: rgba(255,255,255,.09); border-radius: 9px; margin: 8px auto 0; overflow: hidden; }
    #progress { width: 0%; height: 100%; background: linear-gradient(90deg, #b89b5f, #f0dfb1); transition: width .25s ease; }
    .bottomline { display: flex; justify-content: space-between; gap: 12px; width: 100%; margin-top: 7px; color: #7f8b9b; font-size: 10px; letter-spacing: .06em; }
    footer { text-align: center; color: #718092; font-size: 10px; letter-spacing: .12em; padding: 0 15px 8px; position: relative; z-index: 1; }
    body.reading-mode .topbar, body.reading-mode .intro, body.reading-mode footer { display: none; }
    body.reading-mode main { padding: 0; min-height: 0; }
    body.reading-mode .reader-shell {
      width: 100%; height: 100dvh; min-height: 0;
      border-radius: 0; border: 0; padding: 6px 8px;
    }
    body.reading-mode .book-stage { min-height: 0; }
    body.reading-mode .reader-topline { margin-bottom: 4px; }
    body.reading-mode .bottomline { display: none; }
    .bottomline span:last-child { text-align: right; }
    .error { color: #f1b5a9 !important; line-height: 1.8; }
    footer { text-align: center; color: #718092; font-size: 10px; letter-spacing: .12em; padding: 2px 15px 22px; position: relative; z-index: 1; }
    @media (max-width: 640px) {
      .topbar { width: calc(100% - 30px); padding-top: 10px; }
      .top-note { display: none; }
      .intro { padding-top: 5px; }
      .eyebrow { margin-bottom: 6px; letter-spacing: .25em; }
      h1 { font-size: 23px; }
      .ornament { margin-top: 8px; }
      .brand-mark { width: 32px; height: 32px; flex-basis: 32px; }
      .brand-title { font-size: 12px; }
      .brand-subtitle { font-size: 9px; }
      .intro p { font-size: 11px; }
      main { padding: 5px 7px 8px; }
      .reader-shell { border-radius: 14px; padding: 8px 7px 8px; flex: 1; width: 100%; height: calc(100dvh - 165px); }
      .reader-topline { font-size: 10px; margin-bottom: 7px; }
      .book-stage { padding-bottom: 5px; min-height: 0; }
      .controls { gap: 5px; padding-top: 8px; }
      .control-btn { height: 35px; min-width: 34px; padding: 0 8px; border-radius: 9px; font-size: 11px; }
      .control-btn .btn-text { display: none; }
      .page-readout { gap: 5px; font-size: 11px; }
      .page-input { width: 42px; height: 34px; }
      .bottomline { font-size: 9px; }
      footer { padding-bottom: 5px; }
      body { overflow: hidden; }
      body.reading-mode main { padding: 0; }
      body.reading-mode .reader-shell { height: 100dvh; padding: 5px 2px; }
    }
    @media (max-height: 600px) and (orientation: landscape) {
      .topbar { display: none; }
      .intro { padding: 3px 10px 4px; }
      .eyebrow { font-size: 8px; margin-bottom: 2px; }
      h1 { font-size: 17px; letter-spacing: .12em; }
      .intro p, .ornament { display: none; }
      main { padding: 0; }
      .reader-shell { height: calc(100dvh - 48px); padding: 4px 0; border-radius: 0; border-left: 0; border-right: 0; }
      .reader-topline { margin-bottom: 2px; font-size: 9px; }
      .book-stage { padding: 0; }
      .controls { gap: 4px; padding-top: 4px; }
      .control-btn { height: 29px; min-width: 29px; padding: 0 6px; font-size: 10px; }
      .progress-wrap { margin-top: 3px; }
      .bottomline, footer { display: none; }
      body.reading-mode main { padding: 0; }
      body.reading-mode .reader-shell { height: 100dvh; padding: 4px 0; }
    }
    @media (max-width: 760px) and (orientation: landscape) {
      .topbar { padding-top: 5px; padding-bottom: 2px; }
      .brand-mark { width: 27px; height: 27px; flex-basis: 27px; font-size: 15px; }
      .brand-title { font-size: 10px; }
      .brand-subtitle, .top-note, .intro p, .ornament, footer { display: none; }
      .intro { padding: 1px 10px 3px; }
      .eyebrow { font-size: 8px; margin-bottom: 2px; }
      h1 { font-size: 16px; letter-spacing: .12em; }
      main { padding: 2px 0 0; }
      .reader-shell { height: calc(100dvh - 53px); padding: 4px 0 4px; border-radius: 0; border-left: 0; border-right: 0; }
      .reader-topline { margin-bottom: 2px; font-size: 9px; }
      .book-stage { padding: 0; }
      .controls { gap: 4px; padding-top: 5px; }
      .control-btn { height: 30px; min-width: 30px; padding: 0 6px; font-size: 10px; }
      .progress-wrap { margin-top: 4px; }
      .bottomline { display: none; }
      body.reading-mode .reader-shell { height: 100dvh; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <div>
        <div class="brand-title">GRADUATION ARCHIVE</div>
        <div class="brand-subtitle">A BOOK OF OUR MEMORIES</div>
      </div>
    </div>
    <div class="top-note">MEMORIES · FRIENDSHIP · THE FUTURE</div>
  </header>

  <section class="intro">
    <div class="eyebrow">OUR CHAPTER · 2026</div>
    <h1>畢業紀念冊</h1>
    <p>把一起走過的日子，珍藏成永遠。</p>
    <div class="ornament" aria-hidden="true"><span></span></div>
  </section>

  <main>
    <section class="reader-shell" aria-label="電子紀念冊閱讀器">
      <div class="reader-topline">
        <div class="live-status"><span class="status-dot"></span><span id="reader-label">紀念冊閱讀模式</span></div>
        <span id="total-label">準備載入中</span>
      </div>
      <div class="book-stage">
        <div id="loading-status" role="status" aria-live="polite">
          <div class="loader"></div>
          正在準備我們的回憶……
        </div>
        <div id="flipbook" aria-label="可翻頁的 PDF 紀念冊"></div>
      </div>
      <div class="controls" aria-label="翻頁控制">
        <button class="control-btn" id="first-btn" type="button" title="回到封面" aria-label="回到封面" disabled>⇤ <span class="btn-text">封面</span></button>
        <button class="control-btn" id="prev-btn" type="button" title="上一頁" aria-label="上一頁" disabled>← <span class="btn-text">上一頁</span></button>
        <div class="page-readout">
          <input class="page-input" id="page-input" type="number" min="1" value="1" aria-label="跳至頁碼" disabled>
          <span>/</span><span id="page-total">—</span>
        </div>
        <button class="control-btn primary" id="next-btn" type="button" title="下一頁" aria-label="下一頁" disabled><span class="btn-text">下一頁</span> →</button>
        <button class="control-btn" id="last-btn" type="button" title="前往最後一頁" aria-label="前往最後一頁" disabled><span class="btn-text">末頁</span> ⇥</button>
        <button class="control-btn" id="fullscreen-btn" type="button" title="全螢幕閱讀" aria-label="全螢幕閱讀">⛶ <span class="btn-text">全螢幕</span></button>
      </div>
      <div class="progress-wrap" aria-label="閱讀進度"><div id="progress"></div></div>
      <div class="bottomline"><span>可使用按鈕或觸控滑動翻頁</span><span>建議使用全螢幕閱讀</span></div>
      <div class="bottomline">
        <span>慢慢翻閱，記住每一個瞬間。</span>
        <span>建議使用全螢幕閱讀</span>
      </div>
    </section>
  </main>
  <footer>MADE OF MEMORIES · CLASS OF 2026</footer>

  <script src="./build/pdf.min.js"></script>
  <script src="./page-flip.browser.js"></script>
  <script>
    (() => {
      const PDF_URL = './index.pdf';
      const loadingStatus = document.getElementById('loading-status');
      const flipbook = document.getElementById('flipbook');
      const totalLabel = document.getElementById('total-label');
      const pageTotal = document.getElementById('page-total');
      const pageInput = document.getElementById('page-input');
      const progress = document.getElementById('progress');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const firstBtn = document.getElementById('first-btn');
      const lastBtn = document.getElementById('last-btn');
      const fullscreenBtn = document.getElementById('fullscreen-btn');
      let pageFlip = null;
      let totalPages = 0;
      let currentPage = 0;
      const pageTemplates = [];

      if (!window.pdfjsLib || !window.St || !window.St.PageFlip) {
        showError('找不到翻頁程式。請確認 build 資料夾、pdf.min.js 與 page-flip.browser.js 都放在正確位置。');
        return;
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = './build/pdf.worker.min.js';

      function showError(message) {
        loadingStatus.innerHTML = '';
        loadingStatus.classList.add('error');
        loadingStatus.textContent = message;
        totalLabel.textContent = '載入失敗';
      }
      function updateControls(index) {
        currentPage = Math.max(0, Math.min(index, totalPages - 1));
        pageInput.value = String(currentPage + 1);
        pageInput.max = String(totalPages);
        pageTotal.textContent = String(totalPages);
        totalLabel.textContent = `共 ${totalPages} 頁`;
        progress.style.width = `${totalPages > 1 ? (currentPage / (totalPages - 1)) * 100 : 100}%`;
        firstBtn.disabled = prevBtn.disabled = currentPage <= 0;
        nextBtn.disabled = lastBtn.disabled = currentPage >= totalPages - 1;
      }
      function goToPage(value) {
        if (!pageFlip || !totalPages) return;
        const n = Number(value);
        if (!Number.isFinite(n)) { pageInput.value = String(currentPage + 1); return; }
        const target = Math.max(1, Math.min(totalPages, Math.round(n))) - 1;
        pageFlip.turnToPage(target);
        updateControls(target);
      }

      prevBtn.addEventListener('click', () => pageFlip && pageFlip.flipPrev());
      nextBtn.addEventListener('click', () => pageFlip && pageFlip.flipNext());
      firstBtn.addEventListener('click', () => goToPage(1));
      lastBtn.addEventListener('click', () => goToPage(totalPages));
      pageInput.addEventListener('change', () => goToPage(pageInput.value));
      pageInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') { goToPage(pageInput.value); pageInput.blur(); }
      });
      fullscreenBtn.addEventListener('click', async () => {
        try {
          if (!document.fullscreenElement) {
            await document.querySelector('.reader-shell').requestFullscreen();
            document.body.classList.add('reading-mode');
          } else await document.exitFullscreen();
        } catch (error) {
          fullscreenBtn.title = '此瀏覽器不允許全螢幕模式';
        }
      });
      document.addEventListener('keydown', event => {
        if (event.target === pageInput) return;
        if (event.key === 'ArrowLeft' && pageFlip) pageFlip.flipPrev();
        if (event.key === 'ArrowRight' && pageFlip) pageFlip.flipNext();
      });

      let basePageWidth = 0;
      let basePageHeight = 0;
      let resizeTimer = null;
      let swipeStartX = null;
      let swipeStartY = null;
      const stage = document.querySelector('.book-stage');

      function isCompactLayout() {
        // Touch-first devices use single-page mode, including landscape phones.
        return window.matchMedia('(max-width: 760px), (pointer: coarse)').matches;
      }

      function fitBookToScreen() {
        const compact = isCompactLayout();
        const availableWidth = Math.max(160, stage.clientWidth - 18);
        const availableHeight = Math.max(150, stage.clientHeight - 16);
        const pagesAcross = compact ? 1 : 2;
        const fitScale = Math.min(
          availableWidth / (basePageWidth * pagesAcross),
          availableHeight / basePageHeight
        );
        // Always fit the complete page/book to the available screen space.
        const scale = fitScale;
        return {
          pageWidth: Math.max(100, Math.floor(basePageWidth * scale)),
          pageHeight: Math.max(130, Math.floor(basePageHeight * scale)),
          compact
        };
      }

      function rebuildFlipbook() {
        if (!basePageWidth || !basePageHeight || pageTemplates.length === 0) return;
        const savedPage = currentPage;
        if (pageFlip) {
          try { pageFlip.destroy(); } catch (_) {}
          pageFlip = null;
        }
        // PageFlip mutates the page DOM. Recreate it from untouched templates
        // so resizing/fullscreen never leaves an empty or black book.
        flipbook.innerHTML = '';
        for (const template of pageTemplates) {
          flipbook.appendChild(template.cloneNode(true));
        }
        const fit = fitBookToScreen();
        flipbook.style.width = `${fit.pageWidth * (fit.compact ? 1 : 2)}px`;
        flipbook.style.height = `${fit.pageHeight}px`;

        pageFlip = new St.PageFlip(flipbook, {
          width: fit.pageWidth,
          height: fit.pageHeight,
          size: 'fixed',
          minWidth: fit.pageWidth,
          maxWidth: fit.pageWidth,
          minHeight: fit.pageHeight,
          maxHeight: fit.pageHeight,
          maxShadowOpacity: 0.22,
          showCover: true,
          mobileScrollSupport: false,
          usePortrait: fit.compact,
          drawShadow: true,
          flippingTime: 420,
          autoSize: false,
          startPage: Math.min(savedPage, Math.max(0, totalPages - 1))
        });
        pageFlip.loadFromHTML(flipbook.querySelectorAll('.page'));
        pageFlip.on('flip', event => updateControls(Number(event.data) || 0));
        if (savedPage > 0) {
          try { pageFlip.turnToPage(Math.min(savedPage, totalPages - 1)); } catch (_) {}
        }
        updateControls(Math.min(savedPage, totalPages - 1));
      }

      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(rebuildFlipbook, 180);
      });
      document.addEventListener('fullscreenchange', () => {
        const active = Boolean(document.fullscreenElement);
        document.body.classList.toggle('reading-mode', active);
        fullscreenBtn.innerHTML = active ? '⛶ <span class="btn-text">退出全螢幕</span>' : '⛶ <span class="btn-text">全螢幕</span>';
        requestAnimationFrame(() => requestAnimationFrame(rebuildFlipbook));
      });

      // Touch swipe fallback: horizontal swipes navigate pages on phones/tablets.
      stage.addEventListener('pointerdown', event => {
        if (event.pointerType !== 'touch') return;
        swipeStartX = event.clientX;
        swipeStartY = event.clientY;
      }, { passive: true });
      stage.addEventListener('pointerup', event => {
        if (event.pointerType !== 'touch' || swipeStartX === null || swipeStartY === null) return;
        const dx = event.clientX - swipeStartX;
        const dy = event.clientY - swipeStartY;
        swipeStartX = swipeStartY = null;
        if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.25) {
          if (dx < 0 && pageFlip) pageFlip.flipNext();
          else if (dx > 0 && pageFlip) pageFlip.flipPrev();
        }
      }, { passive: true });
      stage.addEventListener('pointercancel', () => {
        swipeStartX = swipeStartY = null;
      }, { passive: true });

      async function loadBook() {
        try {
          loadingStatus.innerHTML = '<div class="loader"></div>正在讀取紀念冊 PDF……';
          const response = await fetch(PDF_URL);
          if (!response.ok) throw new Error(`PDF 讀取失敗（HTTP ${response.status}）`);
          const buffer = await response.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
          totalPages = pdf.numPages;
          totalLabel.textContent = `共 ${totalPages} 頁`;
          pageTotal.textContent = String(totalPages);

          const firstPage = await pdf.getPage(1);
          const baseViewport = firstPage.getViewport({ scale: 1 });
          basePageWidth = baseViewport.width;
          basePageHeight = baseViewport.height;
          // Moderate canvas resolution to reduce memory use and lag on phones.
          const renderScale = Math.min(1.35, Math.max(1.0, (window.devicePixelRatio || 1.1) * 0.75));

          for (let n = 1; n <= totalPages; n++) {
            loadingStatus.innerHTML = `<div class="loader"></div>正在整理回憶…… ${n} / ${totalPages}`;
            const pdfPage = await pdf.getPage(n);
            const viewport = pdfPage.getViewport({ scale: renderScale });
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d', { alpha: false });
            canvas.width = Math.ceil(viewport.width);
            canvas.height = Math.ceil(viewport.height);
            await pdfPage.render({ canvasContext: context, viewport }).promise;
            const pageElement = document.createElement('div');
            pageElement.className = 'page';
            pageElement.appendChild(canvas);
            pageTemplates.push(pageElement.cloneNode(true));
            flipbook.appendChild(pageElement);
          }

          loadingStatus.style.display = 'none';
          flipbook.style.display = 'block';
          requestAnimationFrame(() => requestAnimationFrame(() => {
            rebuildFlipbook();
            pageInput.disabled = false;
            updateControls(0);
            document.getElementById('reader-label').textContent = '已準備好，開始閱讀';
          }));
        } catch (error) {
          console.error(error);
          showError('載入失敗。請確認 index.pdf 與 index.html 位於同一資料夾，並透過本機網站伺服器開啟，而不是直接雙擊 HTML 檔案。');
        }
      }
      window.addEventListener('DOMContentLoaded', loadBook, { once: true });
    })();
  </script>
</body>
</html>
